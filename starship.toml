format = """
$directory\
[](fg:#769ff0 bg:#394260)\
${custom.worktree}\
$git_branch\
$git_status\
[](fg:#394260)\
${custom.devbox}\
$character"""

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

# Only renders inside a *linked* git worktree: shows the slug folder that
# holds the checkout (e.g. "balmy-eagle"), since git's internal worktree id
# (e.g. "cluster-ops20") is noise. In the main checkout it stays hidden.
[custom.worktree]
description = "Show the worktree slug when inside a linked git worktree"
shell = ["bash", "--noprofile", "--norc"]
when = 'test "$(git rev-parse --git-dir 2>/dev/null)" != "$(git rev-parse --git-common-dir 2>/dev/null)"'
command = 'basename "$(dirname "$(git rev-parse --show-toplevel)")"'
style = "bg:#394260"
format = '[[  $output ](fg:#f7c14b bg:#394260)]($style)'

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[custom.devbox]
description = "Visual indicator to show we're in a devbox shell"
command = "if [ -n \"$DEVBOX_SHELL_ENABLED\" ]; then echo ''; fi"
shell = "zsh"
when = "test -n \"$DEVBOX_SHELL_ENABLED\""
